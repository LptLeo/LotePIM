@if (estaAberto()) {
  <div
    class="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm transition-opacity"
  >
    <div
      class="flex flex-col w-full h-full max-w-lg bg-[#0A0A0A] border-l border-[#484847]/40 shadow-2xl animate-slide-in-right"
    >
      <!-- Modal Header -->
      <div
        class="flex items-center justify-between px-6 py-5 bg-[#131313] border-b border-[#484847]/40"
      >
        <div>
          <h2 class="text-lg font-bold text-white tracking-tight">Registrar Entrada</h2>
          <span class="text-[10px] text-[#6B7280] font-bold uppercase tracking-[1.5px]"
            >Novo Lote no Estoque Físico</span
          >
        </div>
        <button
          (click)="aoFechar()"
          class="flex items-center justify-center w-8 h-8 bg-[#1A1A1A] border border-[#484847]/40 text-[#ADAAAA] rounded-full transition-colors hover:text-white hover:bg-red-900/20 hover:border-red-500/50"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="flex-1 p-6 overflow-y-auto custom-scrollbar">
        @if (erro()) {
          <div class="mb-6 p-4 bg-red-950/20 border border-[#dc2626]/40 rounded-md">
            <p class="text-[#fca5a5] text-[12px] font-semibold whitespace-pre-line">
              {{ erro() }}
            </p>
          </div>
        }

        <form [formGroup]="formularioEstoque" class="flex flex-col gap-6">
          <div class="flex flex-col gap-2">
            <label
              for="mp_select"
              class="text-[10px] text-[#6B7280] font-bold uppercase tracking-[1.5px]"
              >Matéria-Prima *</label
            >
            <div class="relative">
              <select
                id="mp_select"
                formControlName="materia_prima_id"
                (change)="limparQuantidade()"
                class="w-full py-2.5 pl-4 pr-10 bg-[#131313] border border-[#484847]/80 text-sm text-white rounded appearance-none cursor-pointer transition-colors focus:outline-none focus:border-[#00E5FF]"
              >
                <option [ngValue]="null" disabled>Selecione...</option>
                @for (mp of catalogo(); track mp.id) {
                  <option [value]="mp.id">{{ mp.nome }} ({{ mp.sku_interno }})</option>
                }
              </select>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white pointer-events-none"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m19.5 8.25-7.5 7.5-7.5-7.5"
                />
              </svg>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-4 min-[425px]:grid-cols-2">
            <div class="flex flex-col gap-2">
              <label
                for="lote_forn"
                class="text-[10px] text-[#6B7280] font-bold uppercase tracking-[1.5px]"
                >Lote do Fornecedor *</label
              >
              <input
                id="lote_forn"
                type="text"
                formControlName="numero_lote_fornecedor"
                placeholder="Ex: LOTE-ABC"
                class="w-full px-4 py-2.5 bg-[#131313] border border-[#484847]/80 text-sm text-white rounded transition-colors focus:outline-none focus:border-[#00E5FF]"
              />
            </div>
            <div class="flex flex-col gap-2">
              <label
                for="fornecedor_input"
                class="text-[10px] text-[#6B7280] font-bold uppercase tracking-[1.5px]"
                >Fornecedor *</label
              >
              <input
                id="fornecedor_input"
                type="text"
                formControlName="fornecedor"
                placeholder="Ex: Samsung"
                class="w-full px-4 py-2.5 bg-[#131313] border border-[#484847]/80 text-sm text-white rounded transition-colors focus:outline-none focus:border-[#00E5FF]"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 gap-4 min-[425px]:grid-cols-2">
            <div class="flex flex-col gap-2">
              <label
                for="qtd_inicial"
                class="text-[10px] text-[#6B7280] font-bold uppercase tracking-[1.5px]"
                >Quantidade Inicial *</label
              >
              <div class="flex">
                <input
                  id="qtd_inicial"
                  type="number"
                  formControlName="quantidade_inicial"
                  placeholder="0"
                  min="0"
                  [attr.step]="unidadeSelecionada() === 'UN' ? '1' : '0.01'"
                  (keydown)="
                    unidadeSelecionada() === 'UN'
                      ? $event.key === '.' || $event.key === ','
                        ? $event.preventDefault()
                        : null
                      : null
                  "
                  class="w-full px-4 py-2.5 bg-[#131313] border border-[#484847]/80 text-sm text-white rounded-l transition-colors focus:outline-none focus:border-[#00E5FF]"
                />
                <span
                  class="flex items-center justify-center px-3 bg-[#1A1A1A] border border-l-0 border-[#484847]/80 text-[#ADAAAA] text-xs font-bold rounded-r"
                  >{{ unidadeSelecionada() }}</span
                >
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <label
                for="turno_select"
                class="text-[10px] text-[#6B7280] font-bold uppercase tracking-[1.5px]"
                >Turno de Recebimento *</label
              >
              <div class="relative">
                <select
                  id="turno_select"
                  formControlName="turno"
                  class="w-full py-2.5 pl-4 pr-10 bg-[#131313] border border-[#484847]/80 text-sm text-white rounded appearance-none cursor-pointer transition-colors focus:outline-none focus:border-[#00E5FF]"
                >
                  <option value="manha">Manhã</option>
                  <option value="tarde">Tarde</option>
                  <option value="noite">Noite</option>
                </select>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                  stroke="currentColor"
                  class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white pointer-events-none"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m19.5 8.25-7.5 7.5-7.5-7.5"
                  />
                </svg>
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <label
              for="data-validade"
              class="text-[10px] text-[#6B7280] font-bold uppercase tracking-[1.5px]"
              >Data de Validade</label
            >
            <div class="flex flex-col gap-3">
              <div
                class="relative h-[42px] cursor-pointer"
                [class.opacity-50]="formularioEstoque.controls.naoAplicaValidade.value"
                [class.pointer-events-none]="
                  formularioEstoque.controls.naoAplicaValidade.value
                "
                (click)="
                  !formularioEstoque.controls.naoAplicaValidade.value &&
                    datePickerValidade.showPicker()
                "
              >
                <div
                  class="flex justify-between items-center w-full h-full px-4 bg-[#131313] border border-[#484847]/80 rounded transition-colors hover:border-[#00E5FF]"
                >
                  <span
                    class="text-sm font-medium"
                    [class.text-white]="formularioEstoque.controls.data_validade.value"
                    [class.text-[#ADAAAA]]="
                      !formularioEstoque.controls.data_validade.value
                    "
                  >
                    {{ dataValidadeExibicao() }}
                  </span>
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="w-5 h-5 text-[#00E5FF]"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"
                    />
                  </svg>
                </div>
                <input
                  #datePickerValidade
                  type="date"
                  formControlName="data_validade"
                  class="absolute inset-0 opacity-0 cursor-pointer pointer-events-none"
                />
              </div>
              <label class="flex items-center gap-2 cursor-pointer">
                <input
                  type="checkbox"
                  formControlName="naoAplicaValidade"
                  class="w-4 h-4 bg-[#131313] border border-[#484847]/80 text-[#00E5FF] rounded focus:ring-[#00E5FF] focus:ring-offset-0 focus:ring-offset-transparent"
                />
                <span class="text-xs text-[#ADAAAA] font-medium"
                  >N/A (Não se aplica)</span
                >
              </label>
            </div>
          </div>
        </form>
      </div>

      <!-- Modal Footer -->
      <div class="flex justify-end gap-3 p-6 bg-[#131313] border-t border-[#484847]/40">
        <button
          type="button"
          (click)="aoFechar()"
          [disabled]="salvando()"
          class="px-5 py-2.5 border border-[#484847] text-[#ADAAAA] text-[11px] font-bold uppercase tracking-wider rounded transition-colors hover:bg-[#1A1A1A] disabled:opacity-50"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="aoSalvar()"
          [disabled]="formularioEstoque.invalid || salvando()"
          class="flex items-center gap-2 px-5 py-2.5 bg-[#00E5FF] text-black text-[11px] font-bold uppercase tracking-wider rounded shadow-[0_0_10px_rgba(0,229,255,0.2)] transition-colors hover:bg-[#00cce6] disabled:opacity-50"
        >
          @if (salvando()) {
            <div
              class="w-3.5 h-3.5 border-2 border-black/30 border-t-black rounded-full animate-spin"
            ></div>
            Salvando...
          } @else {
            Registrar Entrada
          }
        </button>
      </div>
    </div>
  </div>
}
